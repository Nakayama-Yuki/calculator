name: Node.js CI(pnpm)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  #手動でワークフローを実行するためのトリガー
  workflow_dispatch:

# 同じブランチで新しいCIが開始された場合、古いCIをキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# セキュリティのため、必要最小限の権限のみを付与
permissions:
  contents: read

# ジョブの定義（実行される処理のまとまり）
jobs:
  # "build"という名前のジョブ
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ステップ1: リポジトリのコードをチェックアウト（取得）
      - uses: actions/checkout@v7

      # ステップ2: pnpm、Node.js LTS、依存関係をセットアップ
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@lts
          cache: true

      - name: Type check
        run: pnpm run typecheck

      # ステップ3: ESLintを実行
      - name: Run lint
        run: pnpm lint --max-warnings=0

      # ステップ4: Next.jsビルドキャッシュを復元
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          # パッケージまたはソースファイルが変更された場合に新しいキャッシュを生成
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # ソースファイルが変更されたがパッケージが変更されなかった場合、以前のキャッシュから再構築
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # ステップ5: プロジェクトをビルド
      - name: Build project
        run: pnpm run build

      # ステップ6: Playwright用のChromiumをインストール
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # ステップ7: Playwrightのテストを実行
      - name: Run Playwright tests
        run: pnpm exec playwright test

      # ステップ8: 成果物をアップロードする
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
